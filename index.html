<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lean RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --tenant-primary: #DC2626;
      --tenant-secondary: #1F2937;
    }

    body {
      font-family: 'Inter', sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Plynulý přechod pro všechny dark mode změny */
    .dark body {
      background-color: #020617;
    }

    /* slate-950 */

    /* Dynamic Tenant Branding Overrides */
    .bg-red-600 {
      background-color: var(--tenant-primary) !important;
    }

    .text-red-400 {
      color: var(--tenant-primary) !important;
      opacity: 0.8;
    }

    .text-red-500 {
      color: var(--tenant-primary) !important;
    }

    .text-red-600 {
      color: var(--tenant-primary) !important;
    }

    .text-red-700 {
      color: var(--tenant-primary) !important;
      filter: brightness(0.8);
    }

    .border-red-600 {
      border-color: var(--tenant-primary) !important;
    }

    .focus\:ring-red-500:focus {
      --tw-ring-color: var(--tenant-primary) !important;
    }

    .shadow-red-600\/20 {
      --tw-shadow-color: var(--tenant-primary) !important;
    }

    .shadow-red-900\/20 {
      --tw-shadow-color: var(--tenant-primary) !important;
    }

    .accent-red-600 {
      accent-color: var(--tenant-primary) !important;
    }
  </style>
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('lean-rpg-theme');
        const supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && supportDarkMode)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
